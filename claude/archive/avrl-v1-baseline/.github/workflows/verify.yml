name: Verify AVRL package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser tooling
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Unit and security tests
        run: python -m unittest discover -s tests -v
      - name: Browser contract checks
        run: |
          python scripts/browser_checks.py --scenario specs/example-signup/scenarios/desktop.json --feature example-signup
          python scripts/browser_checks.py --scenario specs/example-signup/scenarios/mobile.json --feature example-signup
          python scripts/browser_checks.py --scenario specs/example-signup/scenarios/edge.json --feature example-signup
      - name: Hook JSON schema smoke test
        run: python -m json.tool .claude/settings.json > /dev/null
