name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source organizer
        run: python3 -m unittest discover -s tests -p 'test_source_organizer.py' -v
      - name: Compile source organizer
        run: python3 -m py_compile scripts/organize_claude_sources.py
