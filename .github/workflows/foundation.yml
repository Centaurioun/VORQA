name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source organizer
        run: python3 -m unittest discover -s tests -p 'test_source_organizer.py' -v
      - name: Check GitHub review-policy decision tests
        run: python3 -m unittest discover -s tests -p 'test_github_review_policy.py' -v
      - name: Test Codex plugin preview bridge and package metadata
        run: python3 -m unittest discover -s codex/plugin/vorqa/tests -v
      - name: Validate Codex plugin syntax and manifests
        run: |
          python3 -m py_compile codex/plugin/vorqa/scripts/bridge.py codex/plugin/vorqa/tests/test_bridge.py
          python3 -m json.tool codex/plugin/vorqa/plugin.json > /dev/null
          python3 -m json.tool codex/plugin/vorqa/.codex-plugin/plugin.json > /dev/null
      - name: Compile repository governance helpers
        run: python3 -m py_compile scripts/organize_claude_sources.py scripts/github_review_policy.py
